version: '3.8'

services:
  risk-engine:
    build: .
    container_name: soc-risk-engine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge